name: Run NBA Prop Model

on:
  schedule:
    # Crons are UTC and do not track daylight saving: the ET labels below are
    # summer (EDT) times; from November to mid-March everything is an hour earlier.
    # Two boards per slate, so picks are made on the lines the books post
    # rather than on lines that have moved or been pulled during the day:
    #   the NIGHT BEFORE (~10:30 PM ET) — builds tomorrow's board (--tomorrow)
    #   the MORNING OF   (~9:15 AM ET)  — refreshes today's: re-prices the
    #                                     books, re-checks holds and injuries
    - cron: "30 2 * * *"
    - cron: "15 13 * * *"
    # Grade picks: ~5:30 AM ET (4:30 AM in winter) — after the last West Coast final
    - cron: "30 9 * * *"
  # Data pushed from a local runner (run_daily.sh) redeploys the site
  push:
    branches: [main]
    paths:
      - "web/public/data/**"
      - "logs/**"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options:
          - model
          - grade
          - probe
        default: model
      slate:
        description: "Model only: build today's board or tomorrow's (the night-before run)"
        type: choice
        options:
          - today
          - tomorrow
        default: today
      date:
        description: "Date to grade (YYYY-MM-DD); blank = yesterday. Grade only."
        required: false
        default: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest
    env:
      # stats.nba.com blocks cloud runners, so scheduled model/grade runs only
      # happen here when an NBA_PROXY secret is configured. Without one, the
      # data is produced by run_daily.sh on your own machine and this workflow
      # just exports CSVs and deploys whatever was pushed.
      HAS_PROXY: ${{ secrets.NBA_PROXY != '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine task (model vs grading)
        id: task
        # Routed by which cron fired (or the manual input), never by the wall
        # clock, so a delayed scheduled run can't turn a grading run into a
        # model run.
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TASK="deploy"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ github.event.inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
            TASK="grade"
          else
            TASK="model"
          fi
          MODEL_ARGS=""
          if [ "${{ github.event.schedule }}" = "30 2 * * *" ] || [ "${{ github.event.inputs.slate }}" = "tomorrow" ]; then
            MODEL_ARGS="--tomorrow"
          fi
          echo "Task: $TASK $MODEL_ARGS"
          echo "model_args=$MODEL_ARGS" >> "$GITHUB_OUTPUT"
          echo "run_model=$([ "$TASK" = "model" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run_grade=$([ "$TASK" = "grade" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "run_probe=$([ "$TASK" = "probe" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # "Run workflow" → task: probe — checks whether the NBA API is reachable
      # from this runner, through the NBA_PROXY secret if one is set.
      - name: Probe NBA API reachability
        if: steps.task.outputs.run_probe == 'true'
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
        run: python probe_nba.py

      # Runs even when the NBA probe failed, so one probe task reports both.
      - name: Probe Underdog lines feed
        if: ${{ !cancelled() && steps.task.outputs.run_probe == 'true' }}
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
        run: python probe_underdog.py

      - name: Probe Vegas odds (The Odds API)
        if: ${{ !cancelled() && steps.task.outputs.run_probe == 'true' }}
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python probe_vegas.py

      # Both data steps are non-blocking for the deploy, but a failure shows as a
      # red step on the run and blocks the data commit instead of being swallowed.
      - name: Grade picks (yesterday, or the requested date)
        id: grade
        if: steps.task.outputs.run_grade == 'true' && (env.HAS_PROXY == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          GRADE_DATE: ${{ github.event.inputs.date }}
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
        run: |
          if [ -n "$GRADE_DATE" ]; then
            python grade.py --date "$GRADE_DATE"
          else
            python grade.py
          fi

      - name: Run model
        id: model
        if: steps.task.outputs.run_model == 'true' && (env.HAS_PROXY == 'true' || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        env:
          NBA_PROXY: ${{ secrets.NBA_PROXY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python main.py ${{ steps.task.outputs.model_args }}

      - name: Export CSV fact tables (for BI dashboards)
        # Never blocks the data commit/deploy, but a failure is shown on the run
        continue-on-error: true
        run: python export_csv.py

      # A model run that aborts mid-way publishes nothing, but the sportsbook
      # prices it already paid for are kept so the next run doesn't buy them again.
      - name: Keep purchased sportsbook prices (model aborted)
        if: ${{ !cancelled() && steps.model.outcome == 'failure' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/vegas_*.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "chore: keep sportsbook prices from an aborted run $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin main
          git push

      - name: Commit updated data
        # Never commit the output of a failed model/grade step (a board built
        # on fallbacks alone would overwrite real data).
        if: steps.model.outcome != 'failure' && steps.grade.outcome != 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/latest.json
          git add web/public/data/results_history.json
          git add web/public/data/picks.csv
          git add web/public/data/graded_picks.csv
          git add web/public/data/daily_results.csv
          git add logs/
          git diff --cached --quiet || git commit -m "chore: update props data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

  # ── Deploy to GitHub Pages ──────────────────────────────────────
  deploy:
    needs: run-model
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo (with latest data)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (includes model data just pushed)
        run: git pull --rebase origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build static site
        working-directory: web
        env:
          PAGES_BASE_PATH: /NBA-Player-Prop-Model
          NEXT_PUBLIC_BASE_PATH: /NBA-Player-Prop-Model
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
