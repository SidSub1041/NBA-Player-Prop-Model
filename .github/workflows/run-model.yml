name: Run NBA Prop Model

on:
  schedule:
    # Crons are UTC and do not track daylight saving: the ET labels below are
    # summer (EDT) times; from November to mid-March everything is an hour earlier.
    # Run model 4x/day: ~9:15 AM, 12 PM, 3 PM, 6 PM ET
    - cron: "15 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
    # Grade picks: ~5:30 AM ET (4:30 AM in winter) — after the last West Coast final
    - cron: "30 9 * * *"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options:
          - model
          - grade
        default: model
      date:
        description: "Date to grade (YYYY-MM-DD); blank = yesterday. Grade only."
        required: false
        default: ""

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest changes
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine task (model vs grading)
        id: task
        # Routed by which cron fired (or the manual input), never by the wall
        # clock, so a delayed scheduled run can't turn a grading run into a
        # model run.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TASK="${{ github.event.inputs.task }}"
          elif [ "${{ github.event.schedule }}" = "30 9 * * *" ]; then
            TASK="grade"
          else
            TASK="model"
          fi
          echo "Task: $TASK"
          if [ "$TASK" = "grade" ]; then
            echo "run_model=false" >> "$GITHUB_OUTPUT"
            echo "run_grade=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_model=true" >> "$GITHUB_OUTPUT"
            echo "run_grade=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Grade picks (yesterday, or the requested date)
        if: steps.task.outputs.run_grade == 'true'
        env:
          GRADE_DATE: ${{ github.event.inputs.date }}
        run: |
          if [ -n "$GRADE_DATE" ]; then
            python grade.py --date "$GRADE_DATE" || echo "No picks to grade"
          else
            python grade.py || echo "No picks to grade"
          fi

      - name: Run model
        if: steps.task.outputs.run_model == 'true'
        run: python main.py --fast || echo "Model run failed (no games today or API issue)"

      - name: Export CSV fact tables (for BI dashboards)
        # Never blocks the data commit/deploy, but a failure is shown on the run
        continue-on-error: true
        run: python export_csv.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/latest.json
          git add web/public/data/results_history.json
          git add web/public/data/picks.csv
          git add web/public/data/graded_picks.csv
          git add web/public/data/daily_results.csv
          git add logs/
          git diff --cached --quiet || git commit -m "chore: update props data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main
          git push

  # ── Deploy to GitHub Pages ──────────────────────────────────────
  deploy:
    needs: run-model
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo (with latest data)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (includes model data just pushed)
        run: git pull --rebase origin main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci || npm install

      - name: Build static site
        working-directory: web
        env:
          PAGES_BASE_PATH: /NBA-Player-Prop-Model
          NEXT_PUBLIC_BASE_PATH: /NBA-Player-Prop-Model
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
